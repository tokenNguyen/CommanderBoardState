}

// 3. damage: simulate first strike and regular damage, lethal damage in order, trample, deathtouch, lifelink, indestructible
function simulate() {
  const cb = S.combat, ap = pl(cb.att);
  const unit = (c, owner) => ({ c, owner, P: Math.max(0, pow(c)), T: tou(c), dmg: c.token ? 0 : c.dmg || 0, taken: 0, dead: false, dt: false, log: [] });
  const fights = [], units = [];
  ap.creatures.filter(c => c.attacking && cb.atk[c.id]).forEach(c => {
    const def = pl(cb.atk[c.id]);
    let entries = blocksOn(c.id);
    if (cb.order[c.id]) entries = cb.order[c.id].map(id => entries.find(e => e.bid === id)).filter(Boolean);
    const bl = [];
    entries.forEach(e => { const f = findCreature(e.bid); for (let i = 0; i < e.n; i++) bl.push(unit(f.c, f.owner)); });
    units.push(...bl);
    const k = c.token ? c.attacking : 1;
    for (let i = 0; i < k; i++) {
      // a single creature fights all its blockers; each token of a group fights one blocker (extras pile onto the last token)
      const b = c.token ? (bl[i] ? [bl[i], ...(i === k - 1 ? bl.slice(k) : [])] : []) : bl;
      const a = unit(c, ap);
      units.push(a);
      fights.push({ att: a, def, blockers: b, blocked: b.length > 0, src: c });
    }
  });
  const life = {}, gain = {}, cmd = {};
  const add = (o, id, n) => { o[id] = (o[id] || 0) + n; };
  const first = u => has(u.c, 'first strike') || has(u.c, 'double strike');
  const regular = u => !has(u.c, 'first strike') || has(u.c, 'double strike');
  for (const isFirst of [true, false]) {
    const deals = [];
    const acts = u => !u.dead && (isFirst ? first(u) : regular(u));
    fights.forEach(f => {
      const a = f.att;
      if (acts(a) && a.P > 0) {
        if (!f.blocked) deals.push({ from: a, toP: f.def, amt: a.P });
        else {
          let left = a.P;
          const alive = f.blockers.filter(b => !b.dead), dtA = has(a.c, 'deathtouch'), tr = has(a.c, 'trample');
          alive.forEach((b, i) => {
            const need = dtA ? (b.dt ? 0 : 1) : Math.max(0, b.T - b.dmg - b.taken);
            const amt = i === alive.length - 1 && !tr ? left : Math.min(left, need);
            if (amt > 0) { deals.push({ from: a, toU: b, amt }); left -= amt; }
          });
          if (left > 0 && tr) deals.push({ from: a, toP: f.def, amt: left });
        }
      }
      f.blockers.forEach(b => { if (acts(b) && b.P > 0) deals.push({ from: b, toU: a, amt: b.P }); });
    });
    if (cb.fog) deals.length = 0;
    deals.forEach(d => {
      if (has(d.from.c, 'lifelink')) add(gain, d.from.owner.id, d.amt);
      if (d.toP) { add(life, d.toP.id, d.amt); if (d.from.c.cmdr) add(cmd, d.toP.id, d.amt); d.from.log.push(`${d.amt} to ${d.toP.name}`); }
      else { d.toU.taken += d.amt; if (has(d.from.c, 'deathtouch')) d.toU.dt = true; d.from.log.push(`${d.amt} to ${d.toU.c.name}`); }
    });
    units.forEach(u => {
      if (!u.dead && (u.T <= 0 || (!has(u.c, 'indestructible') && (u.dmg + u.taken >= u.T || u.dt)))) u.dead = true;
    });
  }
  return { fights, units, life, gain, cmd };
}
// combat-damage / attack / dies reminders the tracker can't resolve itself
function triggerNotes(r) {
  const notes = new Set();
  r.fights.forEach(f => {
    const hitPlayer = f.att.log.some(l => l.includes(f.def.name));
    const sources = [f.src, ...attachedTo(f.src.id).map(x => x.pm)];
    sources.forEach(s => { if (/\bwhenever [^.]*\battacks\b/i.test(s.oracle || '')) notes.add(`${s.name}: attack trigger`); });
    if (hitPlayer) sources.forEach(s => { if (/deals combat damage to a player/i.test(s.oracle || '')) notes.add(`${s.name}: combat damage trigger`); });
  });
  r.units.filter(u => u.dead).forEach(u => { if (/\bwhen [^.]*\bdies\b/i.test(u.c.oracle || '')) notes.add(`${u.c.name}: dies trigger`); });
  return [...notes];
}
function cDamage(cb) {
  const r = simulate(), notes = triggerNotes(r);
  const deadBy = {}, hurt = {};
  r.units.forEach(u => {
    if (u.dead) deadBy[u.c.id] = (deadBy[u.c.id] || 0) + 1;
    else if (u.taken && !u.c.token) hurt[u.c.id] = u.taken + u.dmg;
  });
  const cards = S.players.map(p => {
    const lost = r.life[p.id] || 0, gained = r.gain[p.id] || 0;
    const dead = p.creatures.filter(c => deadBy[c.id]), sore = p.creatures.filter(c => hurt[c.id]);
    if (!lost && !gained && !dead.length && !sore.length) return '';
    const net = p.life - lost + gained;
    return `<div class="ccard"><h4 style="--c:${p.color}"><i></i>${esc(p.name)}</h4>
      ${lost || gained ? `<div class="cline ${net < p.life ? 'bad' : 'good'}">♥ <b>${p.life} → ${net}</b>${lost ? ` takes ${lost}` : ''}${gained ? ` · gains ${gained} (lifelink)` : ''}
        ${r.cmd[p.id] ? ` · <b>${r.cmd[p.id]}</b> commander damage (now ${(p.cmdr[cb.att] || 0) + r.cmd[p.id]} of 21)` : ''}</div>` : ''}
      ${dead.map(c => `<div class="cline bad">☠ <b>${esc(c.name)}</b>${c.token && deadBy[c.id] > 1 ? ` ×${deadBy[c.id]}` : ''} ${c.token && deadBy[c.id] > 1 ? 'die' : 'dies'}</div>`).join('')}
      ${sore.map(c => `<div class="cline">🩸 <b>${esc(c.name)}</b> survives with ${hurt[c.id]} damage</div>`).join('')}
    </div>`;
  }).join('');
  // one row per attacker; unblocked tokens of a group are folded together
  const rows = [];
  pl(cb.att).creatures.filter(c => c.attacking && cb.atk[c.id]).forEach(c => {
    const fs = r.fights.filter(f => f.src === c), free = fs.filter(f => !f.blocked);
    if (free.length) rows.push(`<div class="fight"><div class="who">${mini(c, { small: true, cls: 'attacking', tc: pl(cb.atk[c.id]).color })}</div>
      <div class="what"><b>${esc(c.name)}${c.token ? ' ×' + free.length : ''}</b> ${cb.fog ? 'deals no damage (prevented)' : `deals ${sum(free, f => f.att.P)} to ${esc(free[0].def.name)}`}
        ${c.cmdr && !cb.fog ? '<small>commander damage</small>' : ''}<small>unblocked</small></div></div>`);
    fs.filter(f => f.blocked).forEach(f => {
      const entries = blocksOn(c.id);
      rows.push(`<div class="fight"><div class="who">${mini(c, { small: true, cls: `attacking ${f.att.dead ? 'dead' : ''}`, tc: f.def.color })}${
          f.blockers.map(b => mini(b.c, { small: true, cls: b.dead ? 'dead' : '' })).join('')}</div>
        <div class="what"><b>${esc(c.name)}</b> ${f.att.log.length ? 'deals ' + esc(f.att.log.join(', ')) : 'deals no damage'}
          <small>takes ${f.att.taken}${f.att.dead ? ' and dies' : ''}</small>
          ${!c.token && entries.length > 1 ? `<div class="order">Damage order: ${f.blockers.map(b => esc(b.c.name)).join(' → ')}
            <button data-a="cOrder" data-aid="${c.id}">⇅ Change order</button></div>` : ''}</div></div>`);
    });
  });
  return `<p class="lead">This is what will happen. Pump or shrink anything with ⓘ first and these numbers update.</p>
    <div class="acts" style="margin:0 0 12px"><button data-a="cFog" class="${cb.fog ? 'on' : ''}">🌫 ${cb.fog ? 'All combat damage prevented' : 'Prevent all combat damage (Fog)'}</button></div>
    <div class="csum">${cards || '<div class="ccard">Nothing happens.</div>'}</div>
    ${notes.length ? `<div class="ccard" style="margin-top:10px"><h4 style="--c:var(--gold)"><i></i>Remember these triggers</h4>${notes.map(n => `<div class="cline">⚡ ${esc(n)}</div>`).join('')}</div>` : ''}
    <div class="chead">Each fight</div>
    <div class="ccard">${rows.join('') || '<span class="hint">No attackers.</span>'}</div>
    <p class="hint" style="margin-top:12px">Resolve applies it: life totals, commander damage, dead creatures removed (equipment left unattached, auras gone),
      and damage stays on survivors until end of turn.</p>`;
}
function resolveCombat() {
  const cb = S.combat, ap = pl(cb.att), r = simulate();
  S.players.forEach(p => {
    p.life += (r.gain[p.id] || 0) - (r.life[p.id] || 0);
    if (r.cmd[p.id]) p.cmdr[cb.att] = (p.cmdr[cb.att] || 0) + r.cmd[p.id];
  });
  const deaths = {}, marked = {};
  r.units.forEach(u => {
    if (u.dead) deaths[u.c.id] = (deaths[u.c.id] || 0) + 1;
    else if (u.taken && !u.c.token) marked[u.c.id] = (marked[u.c.id] || 0) + u.taken;
  });
  let died = 0;
  S.players.forEach(p => {
    p.creatures = p.creatures.filter(c => {
      if (marked[c.id]) c.dmg = (c.dmg || 0) + marked[c.id];
      const n = deaths[c.id];
      if (!n) return true;
      died += n;
      if (c.token && c.count > n) {
        // the tokens that died were attacking/tapped ones first when they were attackers
        const atkDead = p === ap ? Math.min(n, c.attacking) : 0;
        c.count -= n; c.attacking -= atkDead; if (!has(c, 'vigilance')) c.tapped -= atkDead;
        adj(c, 'count', 0);
        return true;
      }
      dropAttachments(c);
      return false;
    });
  });
  ap.creatures.forEach(c => { c.attacking = 0; });
  const hits = S.players.filter(p => r.life[p.id]).map(p => `${p.name} −${r.life[p.id]}`);
  S.combat = null;
  setTimeout(() => toast(`Combat done${hits.length ? ': ' + hits.join(', ') : ''}${died ? ` · ${died} creature${died > 1 ? 's' : ''} died` : ''}`), 50);
}

// drag a blocker onto an attacker (Arena-style)
let drag = null, suppressClick = false;
document.addEventListener('pointerdown', e => {
  if (!S.combat || S.combat.step !== 1 || e.button > 0 || e.target.closest('.cinfo')) return;
  const mc = e.target.closest('.ctray .cmini, .lane .blk .cmini'); if (!mc) return;
  const f = findCreature(mc.dataset.id); if (!f.c || f.owner.id !== S.combat.defender) return;
  const r = mc.getBoundingClientRect();
  drag = { id: f.c.id, from: mc.dataset.from || null, el: mc, x0: e.clientX, y0: e.clientY, sx: r.left + r.width / 2, sy: r.top + r.height / 2, w: r.width, moved: false };
  try { mc.setPointerCapture(e.pointerId); } catch {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; S.combat.picked = null;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.classList.add('dragghost'); drag.ghost.classList.remove('picked', 'used');
    drag.ghost.style.width = drag.w + 'px';
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('lifted');
    $('arrow').classList.add('show');
  }
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const line = $('arrowLine');
  line.setAttribute('x1', drag.sx); line.setAttribute('y1', drag.sy); line.setAttribute('x2', e.clientX); line.setAttribute('y2', e.clientY);
  const under = document.elementFromPoint(e.clientX, e.clientY), lane = under && under.closest('[data-lane]');
  document.querySelectorAll('.lane.over').forEach(l => { if (l !== lane) l.classList.remove('over'); });
  if (lane) lane.classList.add('over');
  drag.lane = lane ? lane.dataset.lane : null;
});
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  d.ghost.remove(); $('arrow').classList.remove('show');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (!cancel && d.lane !== d.from) {
    if (d.from) unassignBlock(d.id, d.from);
    if (d.lane && !assignBlock(d.id, d.lane)) toast('That creature has no free blockers left.');
  }
  render();
}
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => endDrag(true));

// ---------- events ----------
document.addEventListener('click', e => {
  if (suppressClick) return; // the click that ends a drag
  const el = e.target.closest('[data-a]');
  if (!el || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  if (el.closest('dialog') && !el.closest('#sheet')) return;
  act(el);
});
document.addEventListener('change', e => {
  const a = e.target.dataset.a;
  if (a === 'cmdLife') { S.cmdLife = e.target.checked; render(); }
  if (a === 'attachSel') { findPerm(e.target.dataset.pid).pm.host = e.target.value || null; render(); }
});
function act(el) {
  const a = el.dataset.a, d = parseInt(el.dataset.d), p = S.players[S.view];
  // the creature this is about: a board tile, a card in combat, or the open ⓘ panel; it may be on any player's board
  const holder = el.closest('[data-id]');
  const id = holder ? holder.dataset.id : el.closest('#sheet') ? sheetId : null;
  const found = id ? findCreature(id) : {};
  const c = found.c, cp = found.owner || p;
  const before = c && c.tapped >= c.count;
  const cb = S.combat;
  switch (a) {
    // ----- combat -----
    case 'cStart': {
      const foes = S.players.filter(x => x !== p);
      S.combat = { att: p.id, step: 0, target: foes[0].id, atk: {}, blocks: [], order: {}, defender: null, fog: false, picked: null };
      window.scrollTo(0, 0);
      break;
    }
    case 'cLeave': {
      // cancel the attack: anything that tapped to attack untaps again
      pl(cb.att).creatures.forEach(x => { if (x.attacking && !has(x, 'vigilance')) x.tapped = Math.max(0, x.tapped - x.attacking); x.attacking = 0; });
      S.combat = null; break;
    }
    case 'cTarget': cb.target = el.dataset.p; break;
    case 'cAtk': {
      // already attacking someone else: send it at the chosen opponent instead
      if (c.attacking && cb.atk[c.id] && cb.atk[c.id] !== cb.target) { cb.atk[c.id] = cb.target; break; }
      const r = strike(c);
      if (r !== true) return toast(r);
      if (c.attacking) cb.atk[c.id] = cb.target; else delete cb.atk[c.id];
      break;
    }
    case 'cNext':
      if (cb.step === 0 && !defenders().length) return toast('Choose at least one attacker first.');
      cb.step++; cb.picked = null; window.scrollTo(0, 0);
      break;
    case 'cBack': cb.step = Math.max(0, cb.step - 1); cb.picked = null; break;
    case 'cDef': cb.defender = el.dataset.p; cb.picked = null; break;
    case 'cPick':
      if (cp.id !== cb.defender) break;
      if (availBlock(c) <= 0) { toast('Drag it off its attacker first, or pick another blocker.'); break; }
      cb.picked = cb.picked === c.id ? null : c.id;
      break;
    case 'cLane': if (cb.picked) { assignBlock(cb.picked, el.dataset.lane); cb.picked = null; } break;
    case 'cUnblock': unassignBlock(c.id, el.dataset.from); break;
    case 'cOrder': {
      const ids = (cb.order[el.dataset.aid] || blocksOn(el.dataset.aid).map(b => b.bid)).slice();
      ids.push(ids.shift());
      cb.order[el.dataset.aid] = ids;
      break;
    }
    case 'cFog': cb.fog = !cb.fog; break;
    case 'cResolve': resolveCombat(); break;
    case 'cmdrToggle': c.cmdr = !c.cmdr; break;
    // ----- board -----
    case 'strike': {
      const r = strike(c);
      if (r !== true) {
        const t = document.querySelector(`.tile[data-id="${c.id}"]`);
        if (t) { t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); }
        return toast(r);
      }
      break;
    }
    case 'info': sheetId = c.id; sheetFace = 0; renderSheet(); sheet.showModal(); return;
    case 'close': sheet.close(); return;
    case 'flip': sheetFace = (sheetFace + 1) % c.imgs.length; renderSheet(); return;
    case 'pStep': stepCardPrint(c, d); return;
    case 'edit': sheet.close(); return openDlg(c, c.token ? 'token' : 'creature');
    case 'view': S.view = parseInt(el.dataset.i); break;
    case 'rename':
      ask({ title: 'Player name', input: { value: p.name }, buttons: [{ label: 'Cancel' }, { label: 'Save', value: 'input', primary: true }] })
        .then(n => { if (n && n.trim()) { p.name = n.trim(); render(); } });
      return;
    case 'life': p.life += d; break;
    case 'cmdToggle': S.cmdOpen = !S.cmdOpen; break;
    case 'countsToggle': S.countsOpen = !S.countsOpen; break;
    case 'res': p.res[el.dataset.k] = Math.max(0, p.res[el.dataset.k] + d); break;
    case 'cmd': {
      const o = el.dataset.o, cur = p.cmdr[o] || 0, nv = Math.max(0, cur + d);
      p.cmdr[o] = nv; if (S.cmdLife) p.life -= nv - cur; break;
    }
    case 'cast': return openDlg();
    case 'permEdit': return openDlg(p.perms.find(x => x.id === el.dataset.pid), 'perm');
    case 'permDel': p.perms = p.perms.filter(x => x.id !== el.dataset.pid); break;    case 'fxToggle': { const r = findSrc(p, el.dataset.src).rows[+el.dataset.r]; r.on = r.on === false; break; }
    case 'fxFire': {
      const src = findSrc(p, el.dataset.src), r = src.rows[+el.dataset.r];
      applyRows(p, src.name, [r], src.id, src.host).then(done => {
        if (done.length) toast(`${src.name}: ${doneText(done)}`);
        render(); if (sheet.open) renderSheet();
      });
      return;
    }
    case 'attEdit': { sheet.close(); return openDlg(findPerm(el.dataset.pid).pm, 'perm'); }
    case 'attachNew': { const host = c.id; sheet.close(); return openDlg(null, 'perm', { host }); }
    case 'equipHere': findPerm(el.dataset.pid).pm.host = c.id; break;
    case 'detach': {
      const { pm, owner } = findPerm(el.dataset.pid);
      if (pm.kind === 'aura') owner.perms = owner.perms.filter(x => x !== pm);
      else pm.host = null;
      break;
    }
    case 'eotDel': p.eot = p.eot.filter(x => x.id !== el.dataset.e); break;
    case 'untap': p.creatures.forEach(x => { x.tapped = 0; }); break;
    case 'tapToggle': if (c.tapped >= c.count) c.tapped = 0; else c.tapped = c.count; break;
    case 'delPlayer':
      ask({ title: `Remove ${p.name}?`, text: 'Their board, life and commander damage will be cleared.',
            buttons: [{ label: 'Cancel' }, { label: 'Remove', value: true, danger: true }] }).then(yes => {
        if (!yes || !S.players.includes(p)) return;
        S.players.splice(S.players.indexOf(p), 1); p.creatures.forEach(dropAttachments); S.view = 0; S.active = 0; render();
      });
      return;
    case 'ctr': c.counters += d; break;
    case 'eot': c.tp += d; c.tt += d; break;
    case 'adj': adj(c, el.dataset.f, d); break;
    case 'tapAll': c.tapped = c.count; break;
    case 'untapAll': c.tapped = 0; c.attacking = 0; break;
    case 'ready': c.sick = 0; break;
    case 'split': {
      if (c.count < 2) break;
      const n = { ...c, id: uid(), count: 1, tapped: 0, sick: 0, attacking: 0, rows: [] };
      if (c.count - c.tapped - c.sick <= 0) { if (c.sick > 0) { n.sick = 1; c.sick--; } else { n.tapped = 1; c.tapped--; } }
      c.count--; adj(c, 'count', 0);
      cp.creatures.splice(cp.creatures.indexOf(c) + 1, 0, n); break;
    }
    case 'tap': c.tapped = c.tapped ? 0 : 1; break;
    case 'sick': c.sick = c.sick ? 0 : 1; break;
    case 'del': cp.creatures = cp.creatures.filter(x => x !== c); dropAttachments(c); sheet.close(); break;
  }
  render();
  if (c) animTap(c.id, before, c.tapped >= c.count);
}
$('nextTurn').onclick = () => {
  // end of turn: temporary effects and attack flags clear everywhere; new active player untaps and loses sickness
  // damage wears off too
  S.combat = null;
  S.players.forEach(p => { p.eot = []; p.creatures.forEach(c => { c.tp = 0; c.tt = 0; c.attacking = 0; c.dmg = 0; }); });
  S.active = (S.active + 1) % S.players.length;
  S.view = S.active;
  S.players[S.active].creatures.forEach(c => { c.tapped = 0; c.sick = 0; });
  render();
};
$('addPlayer').onclick = () => { S.players.push(newPlayer(S.players.length)); S.view = S.players.length - 1; render(); };
$('reset').onclick = () => ask({ title: 'Reset everything?', text: 'All players, boards and life totals go back to a fresh game.',
  buttons: [{ label: 'Cancel' }, { label: 'Reset', value: true, danger: true }] }).then(yes => { if (yes) { S = fresh(); render(); } });
render();

// Register the service worker that makes this installable as an app (see sw.js).
// Opening index.html straight from disk (file://) can't use one, so this only runs on the website.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
