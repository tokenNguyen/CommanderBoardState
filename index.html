<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commander Board Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#efe6d2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090c12" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Board Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0:#efe6d2; --bg1:#f8f1e3; --panel:#fffaf0; --panel2:#f1e7d2; --text:#2a2216; --muted:#7d705a; --line:#d9cbae;
    --gold:#9c6b12; --gold2:#c8932e; --frame:#2b2418; --frame-text:#f5ecd8;
    --up:#2b8a3e; --down:#c92a2a; --atk:#e8590c; --lethal:#c92a2a; --eot:#1c7ed6;
    --shadow:0 4px 14px rgba(70,45,0,.16); --display:"Cinzel",Georgia,serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg0:#090c12; --bg1:#141a26; --panel:#181e2b; --panel2:#212839; --text:#ece6d6; --muted:#9a9483; --line:#2c3446;
      --gold:#d9a94a; --gold2:#f3d48a; --frame:#0b0d13; --frame-text:#ece6d6;
      --up:#6bd88a; --down:#ff7b7b; --atk:#ff7a3d; --lethal:#ff5c5c; --eot:#4dabf7;
      --shadow:0 6px 20px rgba(0,0,0,.5);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; color:var(--text); font:15px/1.45 Inter,system-ui,sans-serif; min-height:100vh;
         background:radial-gradient(1400px 700px at 50% -200px, var(--bg1), var(--bg0)) fixed; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 12px; min-height:36px;
           transition:transform .06s, border-color .15s, background .15s; }
  button:hover { border-color:var(--gold); }
  button:active { transform:scale(.95); }
  button.primary { background:linear-gradient(180deg,var(--gold2),var(--gold)); border-color:var(--gold); color:#1d1404; font-weight:700; }
  button.ghost { background:transparent; }
  .bolt { width:1.2em; height:1.2em; vertical-align:-0.25em; fill:currentColor; }
  button.on { background:var(--atk); border-color:var(--atk); color:#fff; font-weight:600; }
  input[type=text], input[type=number], select { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%; }
  input:focus, select:focus { outline:2px solid var(--gold); outline-offset:1px; }

  /* header: scrolls away; the player bar below it sticks */
  header { border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 16px 6px; max-width:1200px; margin:0 auto; }
  .brand { font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:.06em; color:var(--gold); flex:1; white-space:nowrap; }
  .brand span { color:var(--muted); font-weight:600; font-size:13px; letter-spacing:.02em; margin-left:8px; font-family:Inter,sans-serif; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; padding:4px 16px 10px; max-width:1200px; margin:0 auto; }
  .tab { display:flex; align-items:center; gap:8px; padding:5px 12px 5px 8px; border-radius:999px; background:var(--panel); }
  .tab .dot { width:12px; height:12px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 2px color-mix(in srgb, var(--acc) 30%, transparent); }
  .tab .hp { font-family:var(--display); font-weight:700; color:var(--muted); }
  .tab.active { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }
  .tab.active .hp { color:var(--text); }
  .tab.turn::after { content:"⚑"; color:var(--atk); }

  /* sticky player bar: life total and board totals always in view */
  .pbar { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg0) 90%, transparent); backdrop-filter:blur(10px);
          border-bottom:1px solid var(--line); box-shadow:var(--shadow); }
  .pbar .in { max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
              border-top:3px solid var(--acc); }
  .who { flex:1; min-width:150px; }
  .who h2 { margin:0; font-family:var(--display); font-size:20px; display:flex; align-items:center; gap:8px; cursor:pointer; overflow-wrap:anywhere; }
  .who h2 i { flex:0 0 12px; height:12px; border-radius:50%; background:var(--acc); }
  .who h2 small { font-family:Inter,sans-serif; font-size:12px; font-weight:700; color:var(--atk); }
  .stats { display:flex; gap:6px; flex-wrap:wrap; flex-basis:100%; }
  .st { font-size:13px; padding:2px 10px; min-height:0; border-radius:999px; background:var(--panel2); border:1px solid var(--line); white-space:nowrap; }
  .st b { font-family:var(--display); }
  .st.a { border-color:var(--atk); color:var(--atk); }
  .st.warn { border-color:var(--atk); color:var(--atk); } .st.lethal { background:var(--lethal); border-color:var(--lethal); color:#fff; }
  .life { display:flex; align-items:center; gap:4px; }
  .life b { font-family:var(--display); font-size:40px; line-height:1; min-width:70px; text-align:center; }
  .life button { min-width:40px; padding:4px; }

  main { padding:16px; max-width:1200px; margin:0 auto 60px; }

  /* commander damage panel (opened from the ♛ chip) */
  .cmdpanel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:16px; box-shadow:var(--shadow); }
  .cmdpanel .head { display:flex; align-items:center; margin-bottom:10px; }
  .cmdpanel h3 { margin:0; flex:1; font-family:var(--display); font-size:16px; color:var(--gold); }
  .cmd { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
  .cmdtile { background:var(--panel2); border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:12px; padding:10px 12px; }
  .cmdtile .r { display:flex; align-items:center; gap:8px; }
  .cmdtile .nm { flex:1; font-weight:600; overflow-wrap:anywhere; }
  .cmdtile .n { font-family:var(--display); font-size:26px; font-weight:800; min-width:40px; text-align:center; }
  .meter { height:5px; border-radius:9px; background:var(--panel); margin-top:8px; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--acc); border-radius:9px; }
  .cmdtile.warn .meter i { background:var(--atk); }
  .cmdtile.lethal { background:color-mix(in srgb, var(--lethal) 14%, var(--panel)); border-color:var(--lethal); }
  .cmdtile.lethal .n { color:var(--lethal); } .cmdtile.lethal .meter i { background:var(--lethal); }
  .counts { cursor:pointer; padding:10px 12px; }
  .counts .head { margin-bottom:6px; }
  .counts:hover { border-color:var(--gold); }
  .cprev { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; color:var(--muted); }
  .cprev b { font-family:var(--display); color:var(--text); font-size:16px; }
  .cmdpanel .chev { color:var(--muted); }
  .opt-row { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:13px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .hint { color:var(--muted); font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px 16px; border:1px dashed var(--line); border-radius:16px; }

  /* "in play": enchantments/artifacts and the effects currently changing creatures */
  .inplay { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .perm { display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px;
          box-shadow:var(--shadow); flex:1 1 280px; min-width:0; }
  .perm .thumb { flex:0 0 50px; aspect-ratio:488/680; border-radius:5% / 3.6%; background:var(--panel2) center/cover; cursor:pointer; }
  .perm .pb { flex:1; min-width:0; }
  .perm .pb > b { font-family:var(--display); font-size:14px; display:block; margin-bottom:4px; }
  .perm .pa { display:flex; flex-direction:column; gap:4px; }
  .perm .pa button { min-height:28px; padding:2px 9px; }
  .fx { display:inline-flex; align-items:center; gap:4px; font-size:12.5px; line-height:1.3; text-align:left; padding:3px 10px; min-height:26px;
        border-radius:999px; border:1px solid var(--gold); background:color-mix(in srgb, var(--gold) 14%, transparent); margin:2px 4px 2px 0; }
  .fx.off { opacity:.55; border-style:dashed; text-decoration:line-through; }
  .fx.eot { border-color:var(--eot); background:color-mix(in srgb, var(--eot) 14%, transparent); }
  .fx.trig { border-style:dashed; background:transparent; }
  .fx.foreign { border-color:var(--down); background:color-mix(in srgb, var(--down) 10%, transparent); cursor:default; }
  .fx .x { color:var(--muted); font-weight:700; margin-left:2px; }

  /* the battlefield: the card is the tile */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:20px 14px; align-items:end; }
  .tile { position:relative; aspect-ratio:488/680; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
          margin-top:calc(var(--att, 0) * 26px); }
  /* attached equipment/auras: the top strip (name bar) of each shows above the creature */
  .att { position:absolute; left:0; right:0; top:calc(var(--i) * -26px); aspect-ratio:488/680; border-radius:4.75% / 3.5%;
         background:var(--panel2) center top/cover; box-shadow:0 2px 8px rgba(0,0,0,.4); filter:brightness(.92); transition:opacity .2s; }
  .att:hover { filter:none; }
  .att.blank { border:5px solid var(--frame); padding:3px 8px; font:700 12px var(--display); background:linear-gradient(160deg,var(--panel),var(--panel2)); }
  .tile.tapped .att { opacity:0; pointer-events:none; }
  .attto { display:flex !important; align-items:center; gap:6px; margin:0 0 6px !important; font-size:12px; color:var(--muted); }
  .attto select { padding:4px 8px; font-size:13px; }
  .attlist { display:grid; gap:6px; }
  .attrow { display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
  .attrow .th { flex:0 0 30px; aspect-ratio:488/680; border-radius:5% / 3.6%; background:var(--panel) center/cover; }
  .attrow span.n { flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere; }
  .attrow small { color:var(--muted); font-weight:400; }
  .attrow button { min-height:30px; padding:2px 9px; font-size:13px; }
  .face { position:absolute; inset:0; border-radius:4.75% / 3.5%; background:var(--panel2) center/cover; box-shadow:var(--shadow);
          transition:rotate .3s cubic-bezier(.3,1.3,.5,1), scale .3s cubic-bezier(.3,1.3,.5,1); }
  .face.b2 { translate:6px -6px; filter:brightness(.75); } .face.b3 { translate:12px -12px; filter:brightness(.6); }
  .face.blank { display:flex; flex-direction:column; gap:4px; padding:10px; border:6px solid var(--frame);
                background:linear-gradient(160deg,var(--panel),var(--panel2)); font-family:var(--display); }
  .face.blank b { font-size:14px; } .face.blank small { font-family:Inter,sans-serif; font-size:11px; color:var(--muted); flex:1; }
  .tile.tapped .face { rotate:90deg; scale:.718; }
  .tile.attacking .face.front { box-shadow:0 0 0 3px var(--atk), 0 0 22px color-mix(in srgb, var(--atk) 60%, transparent); }
  .tile.shake { animation:shake .35s; }
  @keyframes shake { 25% { translate:-6px 0; } 50% { translate:6px 0; } 75% { translate:-3px 0; } }

  /* overlays: small icons instead of rows of controls */
  .ov { position:absolute; z-index:2; display:flex; gap:4px; flex-wrap:wrap; pointer-events:none; }
  .ov.tl { top:6px; left:6px; max-width:70%; }
  .ov.bl { bottom:8px; left:6px; max-width:62%; }
  .ic { display:inline-flex; align-items:center; gap:3px; height:24px; min-width:24px; padding:0 7px; border-radius:999px;
        font-size:12px; font-weight:700; background:rgba(12,12,16,.82); color:#f3ead6; backdrop-filter:blur(4px); box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .ic.atk { background:var(--atk); color:#fff; }
  .ic.ctr { background:#2b8a3e; color:#fff; } .ic.ctr.neg { background:#c92a2a; }
  .ic.eot { background:#1c7ed6; color:#fff; }
  .ic.anth { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#1d1404; }
  .ic.g { box-shadow:0 0 0 2px var(--gold), 0 2px 6px rgba(0,0,0,.35); }
  .info { position:absolute; z-index:3; top:5px; right:5px; width:32px; height:32px; min-height:0; padding:0; border-radius:50%;
          background:rgba(12,12,16,.82); color:#f3ead6; border:1px solid rgba(255,255,255,.2); font-weight:700; }
  .qty { position:absolute; z-index:3; top:42px; right:5px; font-family:var(--display); font-weight:800; font-size:14px;
         background:var(--acc); color:#1d1404; border-radius:999px; padding:1px 9px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .pt { position:absolute; z-index:3; right:-6px; bottom:-8px; font-family:var(--display); font-weight:800; font-size:21px; line-height:1;
        padding:6px 11px; border-radius:10px; background:linear-gradient(180deg,var(--panel),var(--panel2)); color:var(--text);
        border:2px solid var(--frame); box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .pt.up { color:var(--up); } .pt.down { color:var(--down); }
  .split { position:absolute; z-index:2; left:4px; bottom:-12px; font-size:11px; font-weight:600; white-space:nowrap;
           background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); }

  .toast { position:fixed; left:50%; bottom:24px; translate:-50% 0; z-index:50; background:var(--frame); color:var(--frame-text); max-width:90vw;
           border:1px solid var(--gold); padding:10px 16px; border-radius:12px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }

  /* "target creature": choosing which creature an effect goes on */
  #pickDlg { width:min(460px,94vw); }
  .pickbox { padding:16px; display:grid; gap:10px; }
  .pickbox h3 { margin:0; font-family:var(--display); color:var(--gold); }
  .pickbox h4 { margin:6px 0 0; font-size:13px; color:var(--muted); font-weight:600; }
  .pickbox .attrow { width:100%; text-align:left; cursor:pointer; min-height:0; }
  .pickbox .attrow .th { flex-basis:38px; }
  .pickbox .attrow b { font-variant-numeric:tabular-nums; }
  .pickbox .attrow .tick { flex:0 0 22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center;
                           font-size:13px; font-weight:800; color:transparent; }
  .pickbox .attrow.sel { border-color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, var(--panel2)); }
  .pickbox .attrow.sel .tick { background:var(--gold); border-color:var(--gold); color:#1d1404; }
  .pickbox .attrow:disabled { opacity:.45; cursor:default; }
  #pickGo:disabled { opacity:.5; cursor:default; }
  /* in-app questions (kicked?, what is X?, rename) instead of the browser's own popups */
  #askDlg { width:min(400px,94vw); }
  #askText { margin:0; line-height:1.45; white-space:pre-line; }
  #askText q { display:block; margin-top:6px; color:var(--muted); font-style:italic; quotes:none; }
  .askbtns { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:4px; }
  .askbtns button { flex:1 1 120px; }
  .askbtns.stack { flex-direction:column; }
  .askbtns.stack button { flex:none; text-align:left; padding:10px 12px; }
  .askbtns.stack button:not(:last-child) { background:var(--panel2); }
  .askbtns.stack button.ghost:last-child { text-align:center; color:var(--muted); }
  button.danger { background:color-mix(in srgb, var(--lethal) 18%, var(--panel2)); border-color:var(--lethal); }

  /* dialogs */
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-top:3px solid var(--gold); border-radius:18px;
           width:min(860px,94vw); max-height:92vh; overflow:auto; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  dialog::backdrop { background:rgba(5,6,10,.65); backdrop-filter:blur(3px); }
  .pill { display:flex; align-items:center; border:1px solid var(--line); border-radius:999px; background:var(--panel2); overflow:hidden; }
  .pill button { border:0; border-radius:0; background:transparent; min-height:34px; padding:0 10px; flex:1; font-weight:700; }
  .pill button:hover { background:color-mix(in srgb, var(--gold) 18%, transparent); }
  .pill b { min-width:46px; text-align:center; font-family:var(--display); font-size:15px; }

  /* card detail sheet: big card left, details and controls right */
  .sheet { position:relative; display:grid; grid-template-columns:300px 1fr; gap:22px; padding:20px; }
  .big img, .big .face.blank { width:100%; display:block; border-radius:4.75% / 3.5%; box-shadow:var(--shadow); }
  .big .face.blank { position:relative; aspect-ratio:488/680; }
  .big .flip { margin-top:8px; width:100%; }
  .pnav { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .pnav span { flex:1; text-align:center; font-size:13px; color:var(--muted); line-height:1.25; }
  .pnav span small, .navset { display:block; font-size:12px; color:var(--text); }
  .pnav button { min-height:32px; padding:2px 12px; }
  .navset { text-align:center; min-height:16px; }
  .d h3 { margin:0; padding-right:40px; font-family:var(--display); font-size:22px; }
  .type { color:var(--muted); font-size:13px; margin:2px 0 10px; }
  .oracle { white-space:pre-line; font-size:13.5px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .kws { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .kw { font-size:12px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); }
  .kw.g { border-color:var(--gold); color:var(--gold); }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:14px 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:5px 0; border-bottom:1px dashed var(--line); } td:last-child { text-align:right; font-family:var(--display); font-weight:700; }
  td small { color:var(--muted); }
  tr.total td { border-bottom:0; font-size:17px; } tr.total td:last-child { color:var(--gold); }
  .ctl { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ctl .l { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:3px; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .acts button { flex:1; white-space:nowrap; }
  .acts .x { color:var(--down); }
  .close { position:absolute; top:12px; right:12px; width:34px; height:34px; min-height:0; padding:0; border-radius:50%; }

  /* add / edit dialog */
  .dlg { display:grid; grid-template-columns:1fr 250px; gap:20px; padding:20px; }
  .dlg h3 { margin:0; font-family:var(--display); color:var(--gold); grid-column:1/-1; }
  .dlg label { display:block; margin:12px 0 4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
  .modes { display:flex; flex-wrap:wrap; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .modes button { flex:1 1 auto; border:0; background:transparent; min-height:32px; font-size:13px; font-weight:600; padding:4px 10px; }
  .modes button.sel { background:var(--panel); box-shadow:var(--shadow); color:var(--gold); }
  .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .three[hidden] { display:none; }
  .erow .eCtr { display:flex; align-items:center; gap:6px; margin:0; font-size:13px; color:var(--text); text-transform:none; letter-spacing:0; }
  .erow .eCtr input { width:auto; }
  .search { position:relative; display:flex; gap:6px; }
  .sugg { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:5; background:var(--panel); border:1px solid var(--line);
          border-radius:12px; box-shadow:var(--shadow); max-height:240px; overflow:auto; padding:4px; }
  .sugg div { padding:7px 10px; border-radius:8px; cursor:pointer; }
  .sugg div.sel, .sugg div:hover { background:color-mix(in srgb, var(--gold) 20%, transparent); }
  .msg { min-height:20px; font-size:13px; color:var(--muted); margin-top:10px; }
  .erow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:12px;
          background:var(--panel2); margin-bottom:6px; }
  .erow input, .erow select { background:var(--panel); padding:6px 8px; }
  .ept { display:flex; align-items:center; gap:3px; font-weight:700; }
  .ept input { width:52px; text-align:center; }
  .erow .eKw, .erow .eQual { flex:1 1 130px; width:auto; }
  .erow .eWho, .erow .eWhen, .erow .ePer { flex:1 1 150px; width:auto; }
  .dlg.spell .eWhen { display:none; }
  .eDel { min-height:30px; padding:2px 9px; color:var(--down); }
  .fxhint { font-size:12.5px; color:var(--muted); margin:2px 0 8px; }
  .cardview { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cardimg { width:100%; aspect-ratio:488/680; border-radius:4.75% / 3.5%; background:var(--panel2) center/cover; border:1px solid var(--line);
             display:grid; place-items:center; color:var(--muted); font-size:13px; text-align:center; padding:12px; box-shadow:var(--shadow); }
  .cardimg.has { padding:0; border:0; color:transparent; }
  .nav { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--muted); }
  .nav button { min-height:30px; padding:2px 10px; }
  .foot { grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--line); padding-top:14px; }

  /* death check and marked damage on the board */
  .ic.dmg { background:var(--down); color:#fff; }
  .ic.cm { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#1d1404; }
  .die { position:absolute; z-index:4; left:8%; right:8%; top:42%; min-height:34px; font-weight:700; color:#fff;
         background:var(--down); border-color:var(--down); box-shadow:0 4px 14px rgba(0,0,0,.45); }

  /* ---------- combat mode ---------- */
  body.in-combat header, body.in-combat .pbar { display:none; }
  body.in-combat main { padding-bottom:110px; }
  .ctop { position:sticky; top:0; z-index:10; margin:-16px -16px 14px; padding:10px 16px; background:color-mix(in srgb, var(--bg0) 92%, transparent);
          backdrop-filter:blur(10px); border-bottom:1px solid var(--line); box-shadow:var(--shadow); }
  .ctop .t { display:flex; align-items:center; gap:10px; }
  .ctop h2 { margin:0; flex:1; font-family:var(--display); font-size:20px; color:var(--gold); }
  .csteps { display:flex; gap:6px; margin-top:8px; }
  .cstep { flex:1; text-align:center; padding:6px 4px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted);
           border:1px solid var(--line); background:var(--panel); }
  .cstep b { font-family:var(--display); margin-right:4px; }
  .cstep.on { color:#1d1404; background:linear-gradient(180deg,var(--gold2),var(--gold)); border-color:var(--gold); }
  .cstep.done { color:var(--up); }
  .lead { color:var(--muted); margin:0 0 12px; }
  .lead small { display:block; }
  .pchips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .pchip { display:flex; align-items:center; gap:8px; border-radius:999px; background:var(--panel); padding:6px 14px 6px 10px; }
  .pchip i { width:12px; height:12px; border-radius:50%; background:var(--c); }
  .pchip small { color:var(--muted); }
  .pchip.sel { border-color:var(--c); box-shadow:0 0 0 2px var(--c) inset; font-weight:700; }
  .chead { font-family:var(--display); font-size:15px; letter-spacing:.05em; color:var(--gold); margin:18px 0 10px; }
  .crow { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start; }
  .cwrap { display:flex; flex-direction:column; gap:6px; align-items:center; }
  .cwrap .pill { width:118px; } .cwrap .pill b { min-width:0; font-size:13px; }
  .cmini { position:relative; width:118px; aspect-ratio:488/680; border-radius:4.75% / 3.5%; background:var(--panel2) center/cover;
           box-shadow:var(--shadow); cursor:pointer; flex:0 0 auto; transition:transform .15s, box-shadow .15s, opacity .15s; user-select:none; }
  .cmini.sm { width:92px; }
  .cmini.attacking { box-shadow:0 0 0 3px var(--tc, var(--atk)), 0 0 16px color-mix(in srgb, var(--tc, var(--atk)) 60%, transparent); }
  .cmini.picked { transform:translateY(-8px); box-shadow:0 0 0 3px var(--gold), 0 8px 22px rgba(0,0,0,.45); }
  .cmini.used, .cmini.cant { opacity:.45; }
  .cmini.dead { filter:grayscale(1) brightness(.6); }
  .cmini.lifted { opacity:.3; }
  .cmini .cname { position:absolute; inset:8px; font:700 12px var(--display); }
  .cmini .ctag { position:absolute; left:4px; top:4px; right:30px; display:flex; gap:3px; flex-wrap:wrap; }
  .cmini .ic { height:20px; min-width:20px; padding:0 6px; font-size:11px; }
  .ic.dot { background:var(--tc); color:#fff; }
  .cmini .cqty { position:absolute; right:4px; bottom:30px; font:800 12px var(--display); background:var(--gold2); color:#1d1404; border-radius:999px; padding:0 7px; }
  .cmini .cinfo { position:absolute; top:3px; right:3px; width:26px; height:26px; min-height:0; padding:0; border-radius:50%; font-size:12px;
                  background:rgba(12,12,16,.82); color:#f3ead6; border:1px solid rgba(255,255,255,.2); }
  .cmini .cpt { position:absolute; right:-5px; bottom:-6px; font:800 15px var(--display); padding:3px 7px; border-radius:8px;
                background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--frame); color:var(--text); }
  .cmini .cpt.up { color:var(--up); } .cmini .cpt.down { color:var(--down); }
  .cmini .warn { position:absolute; left:3px; right:3px; bottom:24px; text-align:center; font-size:10px; font-weight:700; color:#fff;
                 background:#e67700; border-radius:6px; padding:2px 3px; }
  .lanes { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .lane { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-direction:column;
          align-items:center; gap:8px; box-shadow:var(--shadow); cursor:pointer; }
  .lane.target { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .lane.over { border-color:var(--atk); box-shadow:0 0 0 3px var(--atk) inset, 0 0 24px color-mix(in srgb, var(--atk) 40%, transparent); }
  .lane .vs { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; }
  .lane .lwarn { font-size:11.5px; font-weight:700; color:#e67700; text-align:center; }
  .lane .blk { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; min-height:40px; }
  .lane .none { font-size:12px; color:var(--muted); border:1px dashed var(--line); border-radius:8px; padding:8px 10px; }

  .ctray .cmini, .lane .blk .cmini { touch-action:none; cursor:grab; }
  .dragghost { position:fixed; z-index:60; pointer-events:none; margin:0; transform:translate(-50%,-60%) rotate(-4deg) scale(1.08);
           box-shadow:0 14px 30px rgba(0,0,0,.5); }
  #arrow { position:fixed; inset:0; width:100vw; height:100vh; z-index:59; pointer-events:none; display:none; }
  #arrow.show { display:block; }
  #arrow line { stroke:var(--gold2); stroke-width:5; stroke-linecap:round; }
  .csum { display:grid; gap:10px; }
  .ccard { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
  .ccard h4 { margin:0 0 6px; font-family:var(--display); font-size:15px; display:flex; align-items:center; gap:8px; }
  .ccard h4 i { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .cline { display:flex; gap:8px; align-items:baseline; padding:3px 0; flex-wrap:wrap; }
  .cline b { font-family:var(--display); }
  .bad { color:var(--down); } .good { color:var(--up); }
  .fight { display:grid; grid-template-columns:auto 1fr; gap:10px 14px; align-items:center; padding:10px 0; border-top:1px dashed var(--line); }
  .fight:first-child { border-top:0; }
  .fight .who { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .fight .what { font-size:14px; }
  .fight .what small { color:var(--muted); display:block; }
  .fight .order button { min-height:26px; padding:0 8px; font-size:12px; margin-top:4px; }
  .cbottom { position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb, var(--bg0) 92%, transparent);
             backdrop-filter:blur(10px); border-top:1px solid var(--line); }
  .cbottom .in { max-width:1200px; margin:0 auto; padding:10px 16px; display:flex; gap:8px; align-items:center; }
  .cbottom .msg { flex:1; font-size:13px; color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }

  @media (max-width:640px) {
    .cmini { width:96px; } .cmini.sm { width:78px; } .cwrap .pill { width:96px; }
    .lanes { grid-template-columns:repeat(2,1fr); }
    .brand span { display:none; }
    .grid { grid-template-columns:repeat(2,1fr); gap:20px 12px; }
    .life b { font-size:34px; min-width:56px; }
    .pbar .in { padding:8px 12px; gap:8px; }
    #sheet { width:100vw; max-width:100vw; margin:auto 0 0; border-radius:18px 18px 0 0; }
    .sheet { grid-template-columns:1fr; } .big { width:62%; margin:0 auto; }
    .dlg { grid-template-columns:1fr; }
    .dlg h3 { order:-2; } .cardview { order:-1; } .cardimg { width:45%; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">✦ Commander Board<span id="turnInfo"></span></div>
    <div class="actions">
      <button class="primary" id="nextTurn">Next turn ▶</button>
      <button id="addPlayer">+ Player</button>
      <button class="ghost" id="reset">Reset</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="pbar" id="pbar"></div>
<main id="main"></main>
<div class="toast" id="toast"></div>
<svg id="arrow"><defs><marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#e0b04f"/></marker></defs>
  <line id="arrowLine" x1="0" y1="0" x2="0" y2="0" marker-end="url(#arrowHead)"/></svg>

<dialog id="sheet"></dialog>

<dialog id="dlg">
  <form method="dialog" class="dlg" id="dlgForm">
    <h3 id="dlgTitle">Add a card</h3>
    <div>
      <div class="modes" id="fModes">
        <button type="button" data-m="creature">Creature</button>
        <button type="button" data-m="token">Tokens</button>
        <button type="button" data-m="perm">Enchantment / artifact</button>
        <button type="button" data-m="spell">Instant / sorcery</button>
      </div>
      <label>Name, start typing to search</label>
      <div class="search">
        <input id="fName" type="text" autocomplete="off" spellcheck="false">
        <button type="button" id="lookup">Search</button>
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div id="fCreat">
        <div class="three">
          <div><label>Power</label><input id="fP" type="number" value="0"></div>
          <div><label>Toughness</label><input id="fT" type="number" value="1"></div>
          <div id="fCountWrap"><label>How many</label><input id="fCount" type="number" min="1" value="1"></div>
        </div>
        <label>Keywords / notes</label><input id="fKw" type="text" placeholder="flying, deathtouch…">
        <label>Power/toughness also counts (for * cards)</label><select id="fStar"></select>
      </div>
      <div id="fAttach" class="three" hidden>
        <div><label>Kind</label><select id="fKind">
          <option value="">Stays on its own</option><option value="equipment">Equipment</option><option value="aura">Aura</option></select></div>
        <div id="fHostWrap" style="grid-column:span 2"><label>Attached to</label><select id="fHost"></select></div>
      </div>
      <div class="msg" id="fMsg"></div>
      <label id="fxTitle">Effects on other creatures</label>
      <div class="fxhint" id="fxHint"></div>
      <div id="fxRows"></div>
      <button type="button" id="fxAdd">+ Add effect</button>
    </div>
    <div class="cardview">
      <div class="cardimg" id="fImg">Search for a card to see it here</div>
      <div class="nav" id="fNav" hidden>
        <button type="button" id="prev">◀</button><span id="navTxt"></span><button type="button" id="next">▶</button>
      </div>
      <small class="navset" id="navSet"></small>
      <button type="button" id="fFlip" hidden>⟲ Flip card</button>
    </div>
    <div class="foot">
      <button type="button" class="ghost" onclick="dlg.close('cancel')">Cancel</button>
      <button class="primary" value="ok" id="fSave">Save</button>
    </div>
  </form>
</dialog>

<dialog id="askDlg">
  <div class="pickbox">
    <h3 id="askTitle"></h3>
    <p id="askText"></p>
    <input id="askInput" type="text" hidden>
    <div class="askbtns" id="askBtns"></div>
  </div>
</dialog>

<dialog id="pickDlg">
  <div class="pickbox">
    <h3 id="pickTitle">Choose a creature</h3>
    <small class="hint" id="pickWhat"></small>
    <div id="pickList" class="attlist"></div>
    <div class="askbtns">
      <button type="button" class="ghost" id="pickCancel">Cancel</button>
      <button type="button" class="primary" id="pickGo" hidden></button>
    </div>
  </div>
</dialog>

<script>
const KEY = 'commander-board-tracker-v2';
const ACC = ['#d9a94a', '#4dabf7', '#ff6b6b', '#51cf66', '#b197fc', '#ff922b'];
const KW = { flying: '🕊', vigilance: '👁', deathtouch: '☠', lifelink: '❤', haste: '⚡', trample: '🐾', reach: '🏹',
             menace: '😈', 'first strike': '🗡', 'double strike': '⚔⚔', hexproof: '🛡', indestructible: '◆', ward: '🔰', defender: '🧱', shroud: '🌫' };
const COLORS = { white: 'W', blue: 'U', black: 'B', red: 'R', green: 'G' };
const BOLT = '<svg class="bolt" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 1 3 9h4.2L6 15l7-8.4H8.6L9.5 1z"/></svg>';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
// res: counts the player keeps by hand (lands, hand, graveyard, artifact tokens) and untracked artifacts/enchantments
const RES0 = { land: 0, hand: 0, grave: 0, treasure: 0, clue: 0, food: 0, xart: 0, xench: 0 };
const newPlayer = i => ({ id: uid(), name: 'Player ' + (i + 1), life: 40, cmdr: {}, creatures: [], perms: [], eot: [], res: { ...RES0 }, color: ACC[i % ACC.length] });

function fresh() { return { active: 0, view: 0, cmdLife: true, players: [0, 1, 2, 3].map(newPlayer) }; }
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { S = fresh(); }
S.players.forEach((p, i) => { p.color = p.color || ACC[i % ACC.length]; p.perms = p.perms || []; p.eot = p.eot || []; p.res = { ...RES0, ...p.res }; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const num = x => (x > 0 ? '+' + x : String(x));
const sum = (arr, f) => arr.reduce((a, c) => a + f(c), 0);
const lvl = n => (n >= 21 ? 'lethal' : n >= 15 ? 'warn' : '');
const kwSplit = s => (s || '').split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
const kws = c => kwSplit(c.kw);

// ---------- effects ----------
// An effect row: { pw, tg, kw, target: mine|opps|all, other, qual, when: static|eot|trigger, on, x }
// pw/tg are numbers, or 'X' / '-X' (x: 'creatures' = number of creatures its controller has, 'ask' = prompt).
// Static rows live on their source (a creature's or a permanent's .rows) and apply while it's on the battlefield.
// Until-end-of-turn effects (spells, enters triggers) are copied into the controller's .eot list with X fixed.
let CALC = {}, EFFS = [];
const xval = (v, x) => (v === 'X' ? x : v === '-X' ? -x : v);
const fmt = v => (typeof v === 'string' ? (v === 'X' ? '+X' : v) : v < 0 ? String(v) : '+' + v);
const creatureCount = p => sum(p.creatures, c => c.count);
// what a "for each ..." / "X is the number of ..." can count, per player
const COUNTS = [['creature', 'creature you control'], ['artifact', 'artifact you control'], ['enchantment', 'enchantment you control'],
  ['equipment', 'Equipment you control'], ['land', 'land you control'], ['hand', 'card in your hand'], ['grave', 'card in your graveyard'],
  ['attacking', 'attacking creature']];
const countLabel = k => (COUNTS.find(x => x[0] === k) || [k, k])[1];
function countOf(p, kind) {
  const typed = re => sum(p.creatures.filter(c => re.test(c.type || '')), c => c.count) + p.perms.filter(x => re.test(x.type || '')).length;
  const r = p.res;
  switch (kind) {
    case 'creature': case 'creatures': return creatureCount(p);
    case 'attacking': return sum(p.creatures, c => c.attacking);
    case 'artifact': return typed(/\bArtifact\b/) + r.treasure + r.clue + r.food + r.xart;
    case 'enchantment': return typed(/\bEnchantment\b/) + r.xench;
    case 'equipment': return p.perms.filter(x => x.kind === 'equipment' || /\bEquipment\b/.test(x.type || '')).length;
    case 'land': return r.land;
    case 'hand': return r.hand;
    case 'grave': return r.grave;
  }
  return 0;
}
// reads what a phrase like "artifact you control" or "other creatures you control" counts: [kind, how many to leave out]
function countKind(t) {
  t = (t || '').toLowerCase();
  if (/\battacking creatures?\b/.test(t)) return ['attacking', 0];
  if (/\bother creatures? you control/.test(t)) return ['creature', 1];
  if (/\bcreatures? you control/.test(t)) return ['creature', 0];
  if (/\bartifacts? you control/.test(t)) return ['artifact', 0];
  if (/\benchantments? you control/.test(t)) return ['enchantment', 0];
  if (/\bequipment you control/.test(t)) return ['equipment', 0];
  if (/\blands? you control/.test(t)) return ['land', 0];
  if (/\bcards? in your hand/.test(t)) return ['hand', 0];
  if (/\bcards? in your graveyard/.test(t)) return ['grave', 0];
  return null;
}
// an effect row's current value for its controller p
function rowVal(r, p) {
  if (r.per) { const n = Math.max(0, countOf(p, r.per) - (r.perMinus || 0)); return { pw: (+r.pw || 0) * n, tg: (+r.tg || 0) * n, n }; }
  if (typeof r.pw === 'string' || typeof r.tg === 'string') {
    const n = !r.x || r.x === 'ask' ? 0 : countOf(p, r.x);
    return { pw: xval(r.pw, n), tg: xval(r.tg, n), n };
  }
  return { pw: r.pw, tg: r.tg };
}

function qualMatch(c, qual) {
  const words = (qual || '').toLowerCase().split(/[\s,]+/).filter(w => w && !['creature', 'creatures', 'and', 'you', 'control'].includes(w));
  const types = ((c.type || '') + ' ' + c.name).toLowerCase().split(/[\s—\-/]+/).filter(Boolean);
  const changeling = kws(c).includes('changeling');
  return words.every(w => {
    if (w === 'token' || w === 'tokens') return c.token;
    if (w === 'nontoken') return !c.token;
    if (w === 'attacking') return c.attacking > 0;
    if (w === 'tapped') return c.tapped > 0;
    if (w === 'untapped') return c.tapped < c.count;
    if (COLORS[w]) return (c.colors || []).includes(COLORS[w]);
    if (types.some(t => w === t || w === t + 's' || w === t + 'es' || (t.endsWith('f') && w === t.slice(0, -1) + 'ves'))) return true;
    return changeling && !['legendary', 'artifact', 'enchantment'].includes(w);
  });
}

function recalc() {
  EFFS = [];
  S.players.forEach(q => {
    [...q.creatures, ...q.perms].forEach(src => (src.rows || []).forEach(r => {
      if (r.when !== 'static' || r.on === false || r.target === 'pick') return;
      // "Equipped/enchanted creature gets ..." only counts while it's attached to something
      if (r.target === 'self' && !src.host) return;
      if (r.target === 'itself' && src.bp == null) return; // only a creature can buff itself
      const v = rowVal(r, q);
      EFFS.push({ ...r, pw: v.pw, tg: v.tg, n: v.n, owner: q, srcId: src.id, name: src.name, static: true,
                  hostId: r.target === 'self' ? src.host : r.target === 'itself' ? src.id : null });
    }));
    q.eot.forEach(e => EFFS.push({ ...e, owner: q, static: false }));
  });
  CALC = {};
  S.players.forEach(p => p.creatures.forEach(c => {
    // "*" power/toughness that counts something (Crusader of Odric, Multani): the count is part of the base
    const star = c.star && c.star.kind ? countOf(p, c.star.kind) : 0;
    const bP = c.bp + (c.star && c.star.onP ? star : 0), bT = c.bt + (c.star && c.star.onT ? star : 0);
    const r = { bP, bT, star, P: bP + c.counters + c.tp, T: bT + c.counters + c.tt, sp: 0, st: 0, ep: c.tp, et: c.tt, aP: 0, aT: 0, kw: new Set(), rows: [] };
    EFFS.forEach(e => {
      if (e.target === 'self' || e.target === 'itself') { if (e.hostId !== c.id) return; }
      else if (e.owner === p ? e.target === 'opps' : e.target === 'mine') return;
      if (e.other && e.srcId === c.id) return;
      if (!qualMatch(c, e.qual)) return;
      r.P += e.pw; r.T += e.tg;
      if (e.static) { r.sp += e.pw; r.st += e.tg; } else { r.ep += e.pw; r.et += e.tg; }
      if (/\battacking\b/i.test(e.qual || '')) { r.aP += e.pw; r.aT += e.tg; }
      kwSplit(e.kw).forEach(k => r.kw.add(k));
      r.rows.push({ name: e.name, p: e.pw, t: e.tg, eot: !e.static, from: e.owner !== p ? e.owner.name : '',
                    per: e.per && e.static ? `${e.n} × ${countLabel(e.per)}` : '' });
    });
    CALC[c.id] = r;

      : { title: name, html: `Does this apply?<q>If ${esc(cd)}: ${esc(up)}</q>`, buttons: [{ label: 'No', value: false }, { label: 'Yes', value: true, primary: true }] });
    if (yes === null) return done; // dismissed: nothing is applied
    rows = !yes ? rows.filter(r => r.cond !== cd)
      : rows.some(r => r.cond === cd && r.instead) ? rows.filter(r => r.cond) : rows;
  }
  for (const r of rows) {
    if (r.target !== 'pick') { if (await applyRow(p, name, r, srcId, hostId)) done.push(r); continue; }
    const chosen = await pickCreature(name, r, p, srcId);
    if (!chosen) continue;
    // X is asked once, then the same pump goes on each chosen creature
    let row = { ...r, target: 'self' };
    const hit = [];
    for (const ch of chosen) {
      const used = await applyRow(p, name, row, srcId, ch.c.id, ch.c.name);
      if (!used) break;
      hit.push(ch.c.name);
      row = { ...row, pw: used.pw, tg: used.tg, per: '', x: null };
    }
    if (hit.length) done.push({ ...r, hostName: hit.join(', '), note: r.cond === 'kicked' ? 'kicked' : '' });
  }
  return done;
}
const findSrc = (p, id) => p.creatures.find(c => c.id === id) || p.perms.find(c => c.id === id);
// equipment and auras: permanents (on their controller's board) linked to the creature they're attached to, on any board
const findPerm = id => { for (const q of S.players) { const pm = q.perms.find(x => x.id === id); if (pm) return { pm, owner: q }; } return {}; };
const findCreature = id => { for (const q of S.players) { const c = q.creatures.find(x => x.id === id); if (c) return { c, owner: q }; } return {}; };
const attachedTo = id => S.players.flatMap(q => q.perms.filter(pm => pm.host === id).map(pm => ({ pm, owner: q })));
const attachKind = type => (/\bEquipment\b/.test(type || '') ? 'equipment' : /\bAura\b/.test(type || '') ? 'aura' : '');
// creatures a permanent can attach to: equipment only to its controller's creatures, auras to anyone's
function hostOptions(kind, owner, selected) {
  const boards = kind === 'equipment' ? [owner] : S.players;
  return `<option value="">${kind === 'aura' ? 'Not enchanting anything' : 'Not attached'}</option>` + boards.map(q => q.creatures.length
    ? `<optgroup label="${esc(q.name)}">${q.creatures.map(c => `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}${c.token ? ' ×' + c.count : ''}</option>`).join('')}</optgroup>` : '').join('');
}
// a creature left the battlefield: its equipment stays, unattached; its auras go to the graveyard
function dropAttachments(c) {
  const freed = [], gone = [];
  S.players.forEach(q => {
    q.perms = q.perms.filter(pm => {
      if (pm.host !== c.id) return true;
      if (pm.kind === 'aura') { gone.push(pm.name); return false; }
      pm.host = null; freed.push(pm.name); return true;
    });
  });
  const msg = [freed.length && `${freed.join(', ')} stay${freed.length > 1 ? '' : 's'} unattached`, gone.length && `${gone.join(', ')} went to the graveyard`].filter(Boolean);
  if (msg.length) toast(msg.join(' · '));
}
const rowChips = (src, label) => (src.rows || []).map((r, i) => {
  const owner = S.players.find(q => q.creatures.includes(src) || q.perms.includes(src));
  const t = (label ? esc(src.name) + ': ' : '') + esc(describeNow(r, owner));
  if (r.when === 'static')
    return `<button class="fx ${r.on === false ? 'off' : ''}" data-a="fxToggle" data-src="${src.id}" data-r="${i}" title="Tap to switch on or off">✦ ${t}</button>`;
  return `<button class="fx trig" data-a="fxFire" data-src="${src.id}" data-r="${i}" title="Apply until end of turn">▶ ${t}${r.when === 'eot' ? ' (on enter)' : ''}</button>`;
}).join('');

// counts for "for each" effects and "*" creatures: some kept by hand, artifacts/enchantments counted from the board
function countsPanel(p) {
  const tracked = k => countOf(p, k) - (k === 'artifact' ? p.res.xart + p.res.treasure + p.res.clue + p.res.food : p.res.xench);
  const tileH = (k, icon, label, val, sub) => `<div class="cmdtile" style="--acc:var(--gold)">
      <div class="r"><span class="nm">${icon} ${label}${sub ? `<br><small class="hint">${sub}</small>` : ''}</span>
        <button data-a="res" data-k="${k}" data-d="-1">−</button><span class="n">${val}</span>
        <button data-a="res" data-k="${k}" data-d="1">+</button></div></div>`;
  // collapsed: a heading and a one-line preview; tap it to open the −/+ controls
  if (!S.countsOpen) {
    const prev = [['🏔', 'Lands', p.res.land], ['⚙', 'Artifacts', countOf(p, 'artifact')], ['✨', 'Enchantments', countOf(p, 'enchantment')],
      ['🃏', 'Hand', p.res.hand], ['🪦', 'Graveyard', p.res.grave],
      ...[['💰', 'Treasure', p.res.treasure], ['🔍', 'Clue', p.res.clue], ['🍗', 'Food', p.res.food]].filter(x => x[2])];
    return `<section class="cmdpanel counts" data-a="countsToggle" title="Tap to change counts">
      <div class="head"><h3>Counts</h3><span class="chev">▾</span></div>
      <div class="cprev">${prev.map(([i, l, n]) => `<span>${i} ${l} <b>${n}</b></span>`).join('')}</div>
    </section>`;
  }
  return `<section class="cmdpanel">
    <div class="head" data-a="countsToggle" style="cursor:pointer"><h3>Counts</h3><span class="chev">▴</span></div>
    <div class="cmd">
      ${tileH('land', '🏔', 'Lands', p.res.land)}
      ${tileH('hand', '🃏', 'Cards in hand', p.res.hand)}
      ${tileH('grave', '🪦', 'Graveyard', p.res.grave)}
      ${tileH('xart', '⚙', 'Artifacts', countOf(p, 'artifact'), `${tracked('artifact')} on the board + ${p.res.xart} untracked`)}
      ${tileH('xench', '✨', 'Enchantments', countOf(p, 'enchantment'), `${tracked('enchantment')} on the board + ${p.res.xench} untracked`)}
      ${tileH('treasure', '💰', 'Treasure', p.res.treasure)}
      ${tileH('clue', '🔍', 'Clue', p.res.clue)}
      ${tileH('food', '🍗', 'Food', p.res.food)}
    </div>
    <div class="opt-row">Artifacts and enchantments you've added are counted automatically; use −/+ there for ones you haven't added (mana rocks, say). Treasure, Clue and Food count as artifacts.</div>
  </section>`;
}

function inPlay(p) {
  const perms = p.perms.map(pm => `<div class="perm">
      <div class="thumb" data-a="permEdit" data-pid="${pm.id}" title="Edit" ${pm.imgs && pm.imgs.length ? `style="background-image:url('${esc(pm.imgs[0])}')"` : ''}></div>
      <div class="pb"><b>${esc(pm.name)}</b>
        ${pm.kind ? `<label class="attto"><span>${pm.kind === 'aura' ? 'Enchanting' : 'Equipped to'}</span>
          <select data-a="attachSel" data-pid="${pm.id}">${hostOptions(pm.kind, p, pm.host)}</select></label>` : ''}
        ${rowChips(pm) || '<span class="hint">No effect set. Tap ✎ to add one.</span>'}</div>
      <div class="pa"><button data-a="permEdit" data-pid="${pm.id}" title="Edit">✎</button><button data-a="permDel" data-pid="${pm.id}" title="Remove from play">✕</button></div>
    </div>`);
  const chips = [
    ...p.creatures.filter(c => (c.rows || []).length).map(c => rowChips(c, true)),
    ...p.eot.map(e => `<button class="fx eot" data-a="eotDel" data-e="${e.id}" title="Remove this effect">⏳ ${esc(e.name)}: ${esc(describe(e))} <span class="x">✕</span></button>`),
    ...EFFS.filter(e => e.owner !== p && e.target !== 'mine')
      .map(e => `<span class="fx foreign ${e.static ? '' : 'eot'}">${e.static ? '✦' : '⏳'} ${esc(e.owner.name)} · ${esc(e.name)}: ${esc(describe(e))}</span>`),
  ];
  if (!perms.length && !chips.length) return '';
  return `<div class="inplay">${perms.join('')}${chips.length ? `<div class="perm"><div class="pb"><b>Effects</b>${chips.join('')}</div></div>` : ''}</div>`;
}

function render() {
  recalc();
  S.view = Math.min(S.view, S.players.length - 1);
  S.active = Math.min(S.active, S.players.length - 1);
  $('turnInfo').textContent = S.players[S.active].name + "'s turn";
  $('tabs').innerHTML = S.players.map((p, i) =>
    `<button class="tab ${i === S.view ? 'active' : ''} ${i === S.active ? 'turn' : ''}" style="--acc:${p.color}" data-a="view" data-i="${i}">
       <span class="dot"></span><span>${esc(p.name)}</span><span class="hp">${p.life}</span></button>`).join('');

  // combat takes over the screen until it's resolved or left
  document.body.classList.toggle('in-combat', !!S.combat);
  if (S.combat) {
    $('main').innerHTML = combatView();
    if (S.combat) { if (sheet.open) renderSheet(); save(); return; }
    document.body.classList.remove('in-combat');
  }

  const p = S.players[S.view];
  const blk = p.creatures.filter(c => c.count - c.tapped > 0);
  const others = S.players.filter(x => x.id !== p.id);
  const worst = Math.max(0, ...others.map(o => p.cmdr[o.id] || 0));
  const bT = c => tou(c) - (CALC[c.id] ? CALC[c.id].aT : 0);

  const bar = $('pbar');
  bar.style.setProperty('--acc', p.color);
  bar.innerHTML = `<div class="in">
    <div class="who">
      <h2 data-a="rename" title="Tap to rename"><i></i>${esc(p.name)}${S.view === S.active ? '<small>⚑ turn</small>' : ''}</h2>
    </div>
    <div class="life">
      <button data-a="life" data-d="-5">−5</button><button data-a="life" data-d="-1">−1</button>
      <b>${p.life}</b>
      <button data-a="life" data-d="1">+1</button><button data-a="life" data-d="5">+5</button>
    </div>
      <div class="stats">
        <span class="st" title="All your creatures: total power / total toughness">▦ <b>${sum(p.creatures, c => c.count)}</b> creature${sum(p.creatures, c => c.count) === 1 ? '' : 's'} · <b>${sum(p.creatures, c => c.count * pow(c))} / ${sum(p.creatures, c => c.count * tou(c))}</b></span>
        <span class="st" title="Untapped creatures (what you can block with): total power / total toughness">🛡 <b>${sum(blk, c => c.count - c.tapped)}</b> untapped · <b>${sum(blk, c => (c.count - c.tapped) * (pow(c) - (CALC[c.id] ? CALC[c.id].aP : 0)))} / ${sum(blk, c => (c.count - c.tapped) * bT(c))}</b></span>
        <button class="st ${lvl(worst)}" data-a="cmdToggle" title="Commander damage taken">♛ <b>${others.map(o => p.cmdr[o.id] || 0).join(' · ')}</b></button>
      </div>
    </div>`;

  const m = $('main');
  m.style.setProperty('--acc', p.color);
  m.innerHTML = `
    ${S.cmdOpen ? `<section class="cmdpanel">
      <div class="head"><h3>Commander damage taken</h3><button class="ghost" data-a="cmdToggle">✕</button></div>
      <div class="cmd">${others.map(o => {
        const n = p.cmdr[o.id] || 0;
        return `<div class="cmdtile ${lvl(n)}" style="--acc:${o.color}">
          <div class="r"><span class="nm">${esc(o.name)}</span>
            <button data-a="cmd" data-o="${o.id}" data-d="-1">−</button><span class="n">${n}</span>
            <button data-a="cmd" data-o="${o.id}" data-d="1">+</button></div>
          <div class="meter"><i style="width:${Math.min(100, n / 21 * 100)}%"></i></div></div>`; }).join('')}</div>
      <label class="opt-row"><input type="checkbox" data-a="cmdLife" ${S.cmdLife ? 'checked' : ''}> Commander damage also changes life total</label>
    </section>` : ''}
    ${countsPanel(p)}
    <div class="toolbar">
      <button class="primary" data-a="cast">${BOLT} Cast a spell</button>
      ${p.creatures.length && S.players.length > 1 ? '<button data-a="cStart">⚔ Combat</button>' : ''}
      <button data-a="untap">Untap all</button>
      ${S.players.length > 2 ? '<button class="ghost" data-a="delPlayer">Remove player</button>' : ''}
      ${p.creatures.length ? '<span class="hint">Tap a card to tap or untap it · ⓘ for details · attack from ⚔ Combat</span>' : ''}
    </div>
    ${inPlay(p)}
    ${p.creatures.length ? `<div class="grid">${p.creatures.map(tile).join('')}</div>`
      : `<div class="empty">No creatures yet. Tap ${BOLT} Cast a spell to add one, or a pile of tokens.</div>`}`;
  if (sheet.open) renderSheet();
  save();
}

// death check: toughness 0 or less (even indestructible), or marked damage at least its toughness (unless indestructible)
const lethal = c => tou(c) <= 0 || (!has(c, 'indestructible') && !c.token && c.dmg > 0 && c.dmg >= tou(c));

// ---------- battlefield tiles ----------
function faceEl(c, i) {
  const cls = `face ${i > 1 ? 'b' + i : 'front'}`;
  return c.imgs && c.imgs.length
    ? `<div class="${cls}" style="background-image:url('${esc(c.imgs[0])}')"></div>`
    : `<div class="${cls} blank"><b>${esc(c.name)}</b><small>${esc(c.type || (c.token ? 'Token creature' : 'Creature'))}</small></div>`;
}
function tile(c) {
  const allTapped = c.tapped >= c.count;
  const k = CALC[c.id];
  let faces = '';
  for (let i = c.token ? Math.min(c.count, 3) : 1; i >= 1; i--) faces += faceEl(c, i);
  // equipment and auras peek out from behind the top of the card, like on a real table
  const atts = attachedTo(c.id);
  const peeks = atts.map(({ pm }, i) => `<div class="att ${pm.imgs && pm.imgs.length ? '' : 'blank'}" style="--i:${atts.length - i};${
      pm.imgs && pm.imgs.length ? `background-image:url('${esc(pm.imgs[0])}')` : ''}" data-a="attEdit" data-pid="${pm.id}" title="${esc(pm.name)}">${
      pm.imgs && pm.imgs.length ? '' : esc(pm.name)}</div>`).join('');
  const tl = [
    c.attacking && `<span class="ic atk" title="Attacking">⚔${c.token ? ' ' + c.attacking : ''}</span>`,
    c.cmdr && '<span class="ic cm" title="Commander">♛</span>',
    c.sick && `<span class="ic" title="Summoning sick">💤${c.token ? ' ' + c.sick : ''}</span>`,
    c.dmg && `<span class="ic dmg" title="Damage marked until end of turn">🩸${c.dmg}</span>`,
    allTapped && atts.length && `<span class="ic" title="${esc(atts.map(a => a.pm.name).join(', '))}">📎${atts.length}</span>`,
  ];
  const bl = [
    c.counters && `<span class="ic ctr ${c.counters < 0 ? 'neg' : ''}" title="${c.counters > 0 ? '+1/+1' : '−1/−1'} counters">${c.counters > 0 ? '▲' : '▼'}${Math.abs(c.counters)}</span>`,
    (k.sp || k.st) && `<span class="ic anth" title="From effects in play">✦${num(k.sp)}/${num(k.st)}</span>`,
    (k.ep || k.et) && `<span class="ic eot" title="Until end of turn">⏳${num(k.ep)}/${num(k.et)}</span>`,
    ...kws(c).map(w => KW[w] && `<span class="ic" title="${esc(w)}">${KW[w]}</span>`),
    ...granted(c).map(w => KW[w] && `<span class="ic g" title="${esc(w)} (from an effect)">${KW[w]}</span>`),
  ];
  return `<div class="tile ${allTapped ? 'tapped' : ''} ${c.attacking ? 'attacking' : ''}" data-id="${c.id}" data-a="tapToggle" title="${esc(c.name)}" style="--att:${atts.length}">
    ${peeks}${faces}
    <div class="ov tl">${tl.filter(Boolean).join('')}</div>
    <div class="ov bl">${bl.filter(Boolean).join('')}</div>
    <button class="info" data-a="info" title="Details">ⓘ</button>
    ${c.token ? `<span class="qty">×${c.count}</span>` : ''}
    <div class="pt ${ptClass(c)}">${pow(c)}/${tou(c)}</div>
    ${lethal(c) ? `<button class="die" data-a="del" title="Its toughness is 0 or less, or it has lethal damage">☠ ${c.token ? 'They die' : 'It dies'}: remove</button>` : ''}
    ${c.token && c.tapped && !allTapped ? `<span class="split">${c.count - c.tapped} ready · ${c.tapped} tapped</span>` : ''}
  </div>`;
}

// ---------- detail sheet ----------
const sheet = $('sheet');
let sheetId = null, sheetFace = 0;
const pill = (a, f, val) =>
  `<div class="pill"><button data-a="${a}" ${f ? `data-f="${f}"` : ''} data-d="-1">−</button><b>${val}</b><button data-a="${a}" ${f ? `data-f="${f}"` : ''} data-d="1">+</button></div>`;
function renderSheet() {
  const c = findCreature(sheetId).c;
  if (!c) { sheet.close(); return; }
  const P = pow(c), T = tou(c), list = kws(c), gk = granted(c), imgs = c.imgs || [];
  const fxRows = (CALC[c.id] ? CALC[c.id].rows : []).filter(r => r.p || r.t);
  sheet.innerHTML = `<div class="sheet">
    <div class="big">
      ${imgs.length ? `<img src="${esc(imgs[sheetFace] || imgs[0])}" alt="${esc(c.name)}">` : faceEl(c, 1).replace('face front', 'face')}
      ${imgs.length && (c.oid || !c.token) ? `<div class="pnav"><button data-a="pStep" data-d="-1" title="Previous printing">◀</button>
        <span>${esc(printPos(c))}<small>${esc(c.setLabel || '')}</small></span><button data-a="pStep" data-d="1" title="Next printing">▶</button></div>` : ''}
      ${imgs.length > 1 ? '<button class="flip" data-a="flip">⟲ Flip card</button>' : ''}
    </div>
    <div class="d">
      <h3>${esc(c.name)}${c.token ? ` <span style="color:var(--muted)">×${c.count}</span>` : ''}</h3>
      <div class="type">${esc(c.type || (c.token ? 'Token creature' : 'Creature'))}</div>
      ${c.oracle ? `<div class="oracle">${esc(c.oracle)}</div>` : ''}
      ${list.length || gk.length ? `<div class="kws">${list.map(k => `<span class="kw">${KW[k] || ''} ${esc(k)}</span>`).join('')}${
        gk.map(k => `<span class="kw g" title="From an effect">${KW[k] || ''} ${esc(k)} ✦</span>`).join('')}</div>` : ''}
      <div class="lbl">Power / toughness${c.token && c.count > 1 ? ` · group ${c.count * P}/${c.count * T}` : ''}</div>
      <table>
        <tr><td>Base${c.star && c.star.kind ? ` <small>(${[c.star.onP && 'power', c.star.onT && 'toughness'].filter(Boolean).join(' and ')} + ${CALC[c.id].star} ${plural(countLabel(c.star.kind))})</small>` : ''}</td>
          <td>${CALC[c.id].bP}/${CALC[c.id].bT}</td></tr>
        ${c.counters ? `<tr><td>${c.counters < 0 ? '−1/−1' : '+1/+1'} counters</td><td>${num(c.counters)}/${num(c.counters)}</td></tr>` : ''}
        ${fxRows.map(r => `<tr><td>${r.eot ? '⏳' : '✦'} ${esc(r.name)}${r.from ? ` <small>(${esc(r.from)})</small>` : ''}${r.per ? ` <small>(${esc(r.per)})</small>` : ''}${r.eot ? ' <small>until end of turn</small>' : ''}</td><td>${num(r.p)}/${num(r.t)}</td></tr>`).join('')}
        ${c.tp || c.tt ? `<tr><td>⏳ Pumped until end of turn</td><td>${num(c.tp)}/${num(c.tt)}</td></tr>` : ''}
        <tr class="total"><td>Current</td><td>${P}/${T}</td></tr>
      </table>
      ${(c.rows || []).length ? `<div class="lbl">Effects it gives</div><div>${rowChips(c)}</div>` : ''}
      <div class="lbl">Equipment and auras</div>
      <div class="attlist">${attachedTo(c.id).map(({ pm, owner }) => `<div class="attrow">
          <span class="th" ${pm.imgs && pm.imgs.length ? `style="background-image:url('${esc(pm.imgs[0])}')"` : ''}></span>
          <span class="n">${esc(pm.name)}${owner !== S.players[S.view] ? ` <small>(${esc(owner.name)})</small>` : ''}<br><small>${
            (pm.rows || []).filter(r => r.target === 'self').map(describe).map(esc).join('; ') || (pm.kind === 'aura' ? 'Aura' : 'Equipment')}</small></span>
          <button data-a="attEdit" data-pid="${pm.id}" title="Edit">✎</button>
          <button data-a="detach" data-pid="${pm.id}">${pm.kind === 'aura' ? 'Remove' : 'Unattach'}</button>
        </div>`).join('')}
        ${S.players[S.view].perms.filter(pm => pm.kind === 'equipment' && !pm.host)
          .map(pm => `<button data-a="equipHere" data-pid="${pm.id}">🛠 Equip ${esc(pm.name)} here</button>`).join('')}
        <button data-a="attachNew">＋ Attach equipment or an aura</button>
      </div>
      <div class="lbl">Adjust</div>
      <div class="ctl">
        <div><div class="l">+1/+1 counters</div>${pill('ctr', '', num(c.counters))}</div>
        <div><div class="l">Until end of turn</div>${pill('eot', '', `${num(c.tp)}/${num(c.tt)}`)}</div>
        ${c.token ? `
        <div><div class="l">Count</div>${pill('adj', 'count', c.count)}</div>
        <div><div class="l">Tapped</div>${pill('adj', 'tapped', c.tapped)}</div>
        <div><div class="l">Summoning sick</div>${pill('adj', 'sick', c.sick)}</div>` : ''}
      </div>
      <div class="acts">
        ${c.token ? `
        <button data-a="tapAll">Tap all</button><button data-a="untapAll">Untap all</button>
        <button data-a="ready">All ready</button><button data-a="split" title="Move one token into its own group">Split 1</button>` : `
        <button data-a="tap">${c.tapped ? 'Untap' : 'Tap'}</button>
        <button data-a="sick">${c.sick ? 'Ready' : 'Summoning sick'}</button>`}
      </div>
      <div class="acts">
        <button data-a="cmdrToggle" class="${c.cmdr ? 'on' : ''}" title="Its combat damage to a player counts as commander damage">♛ ${c.cmdr ? 'Commander' : 'Mark as commander'}</button>
        <button data-a="edit">✎ Edit</button>
        <button class="x" data-a="del">Remove</button>
      </div>
    </div>
    <button class="close" data-a="close" title="Close">✕</button>
  </div>`;

// tap the card: attack with it (a token group sends every ready token), or cancel the attack
function strike(c) {
  const vig = has(c, 'vigilance'), haste = has(c, 'haste');
  if (c.attacking) { if (!vig) c.tapped = Math.max(0, c.tapped - c.attacking); c.attacking = 0; return true; }
  const ready = c.count - c.tapped - (haste ? 0 : c.sick);
  if (ready <= 0) return c.tapped >= c.count ? 'Already tapped. Untap it first.' : "Summoning sick, so it can't attack yet.";
  c.attacking = ready; if (!vig) c.tapped += ready;
  return true;
}
function animTap(id, was, now) {
  if (was === now) return;
  const t = document.querySelector(`.tile[data-id="${id}"]`); if (!t) return;
  const up = { rotate: '0deg', scale: 1 }, side = { rotate: '90deg', scale: .718 };
  t.querySelectorAll('.face').forEach(f =>
    f.animate(now ? [up, side] : [side, up], { duration: 300, easing: 'cubic-bezier(.3,1.3,.5,1)' }));
}
let toastT;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

function adj(c, f, d) {
  if (f === 'count') { c.count = Math.max(1, c.count + d); if (d > 0) c.sick = Math.min(c.count, c.sick + d); }
  else if (f === 'attacking') {
    const v = c.attacking + d;
    if (v < 0 || v > c.count - (has(c, 'haste') ? 0 : c.sick)) return;
    c.attacking = v; if (!has(c, 'vigilance')) c.tapped += d;
  } else c[f] += d;
  c.tapped = Math.min(c.count, Math.max(0, c.tapped));
  c.sick = Math.min(c.count, Math.max(0, c.sick));
  c.attacking = Math.min(c.count, Math.max(0, c.attacking));
}

  const sm = (starP || starT) && oracle.match(/\b(?:power|toughness)\b[^.]*?\bequal to (?:the number of |twice the number of )?([^.]+)/i);

    if (isTok()) {

}

// ---------- combat ----------
// S.combat: { att: attacking player id, step: 0 attack | 1 block | 2 damage, target, atk: { creatureId: defenderId },
//             blocks: [{ bid: blocker id, aid: attacker id, n: how many (token groups) }], order: { attackerId: [blocker ids] }, defender, fog }
const pl = id => S.players.find(x => x.id === id);
const shortName = n => n.replace(/^Player /, 'P');
const blocksOn = aid => S.combat.blocks.filter(b => b.aid === aid);
const assignedFrom = bid => sum(S.combat.blocks.filter(b => b.bid === bid), b => b.n);
const availBlock = c => c.count - c.tapped - assignedFrom(c.id);
function assignBlock(bid, aid) {
  const { c } = findCreature(bid);
  if (!c || availBlock(c) <= 0) return false;
  const e = S.combat.blocks.find(b => b.bid === bid && b.aid === aid);
  if (e) e.n++; else S.combat.blocks.push({ bid, aid, n: 1 });
  delete S.combat.order[aid];
  return true;
}
function unassignBlock(bid, aid) {
  const e = S.combat.blocks.find(b => b.bid === bid && b.aid === aid);
  if (!e) return;
  if (!--e.n) S.combat.blocks = S.combat.blocks.filter(x => x !== e);
  delete S.combat.order[aid];
}
// keep combat consistent with the boards (creatures removed, attack counts changed in the ⓘ panel, ...)
function syncCombat() {
  const cb = S.combat, ap = pl(cb.att);
  if (!ap) { S.combat = null; return; }
  Object.keys(cb.atk).forEach(id => { const c = ap.creatures.find(x => x.id === id); if (!c || !c.attacking) delete cb.atk[id]; });
  ap.creatures.forEach(c => { if (c.attacking && !cb.atk[c.id]) cb.atk[c.id] = cb.target; });
  cb.blocks = cb.blocks.filter(b => cb.atk[b.aid] && findCreature(b.bid).c);
  cb.blocks.forEach(b => { const { c } = findCreature(b.bid); while (b.n > 0 && c.count - c.tapped - assignedFrom(c.id) < 0) b.n--; });
  cb.blocks = cb.blocks.filter(b => b.n > 0);
}
const defenders = () => S.players.filter(f => f.id !== S.combat.att && pl(S.combat.att).creatures.some(c => S.combat.atk[c.id] === f.id));

function mini(c, { cls = '', tags = '', small = false, a = '', attrs = '', tc = '' } = {}) {

function combatView() {

  const ap = pl(cb.att), foes = S.players.filter(x => x.id !== ap.id);
  const body = [cAttack, cBlock, cDamage][cb.step](cb, ap, foes);

// 1. attack: pick an opponent, tap creatures to send them at that opponent

// 2. block: each defender drags (or taps) their untapped creatures onto attackers
function laneWarn(a, entries) {
  const n = sum(entries, e => e.n);
  if (has(a, 'menace') && n === 1 && !a.token) return 'Menace: needs two or more blockers';
  return '';
}
function blockWarn(a, b) {

  return '';
}
function cBlock(cb, ap) {

        return mini(c, { small: true, a: 'cPick', cls: `${cb.picked === c.id ? 'picked' : ''} ${left ? '' : 'used'}`,
